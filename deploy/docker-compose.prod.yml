# Production stack for the Oracle Cloud VM.
#   db      - PostgreSQL 16 + PostGIS, data on a named volume
#   api     - FastAPI (uvicorn); creates/updates the schema on start
#   worker  - the durable analysis worker (python -m app.worker)
#   caddy   - TLS termination for hin-api.mhaske.com, proxies to api
#
# Secrets come from deploy/.env (generated by cloud-init, never committed).

name: nj-hin

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  APP_ENVIRONMENT: production
  ANONYMOUS_RATE_LIMIT_SECRET: ${ANONYMOUS_RATE_LIMIT_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS}
  API_RELOAD: "false"
  DEBUG: "false"
  # Requests arrive from Caddy on the compose network; trust its X-Forwarded-*.
  FORWARDED_ALLOW_IPS: "*"

services:
  db:
    # imresamu/postgis is a multi-arch build (amd64 + arm64) of the official
    # docker-postgis image; postgis/postgis itself is amd64-only and will not
    # start on the Ampere A1 VM.
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres -c shared_buffers=2GB -c work_mem=64MB -c maintenance_work_mem=1GB
               -c max_wal_size=4GB -c effective_cache_size=12GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 1g

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: nj-hin-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
    # The API never runs DDL itself; apply the schema before serving.
    command: >
      sh -c "python scripts/init_schema.py &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
                  --forwarded-allow-ips '*' --limit-concurrency 32 --timeout-keep-alive 5"
    volumes:
      - hindata:/srv/data
    expose:
      - "8000"

  worker:
    image: nj-hin-backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - hindata:/srv/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/log/nj-hin:/srv/logs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  hindata:
  caddy_data:
  caddy_config:
