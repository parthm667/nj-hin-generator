# Production stack for the Oracle Cloud VM.
#   db      – PostgreSQL 16 + PostGIS, data on a named volume
#   backend – FastAPI (uvicorn), reachable only inside the compose network
#   caddy   – TLS termination for hin-api.mhaske.com, proxies to backend
#
# Secrets come from deploy/.env (generated by cloud-init, never committed).

name: nj-hin

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 1g

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "false"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      SOCRATA_API_TOKEN: ${SOCRATA_API_TOKEN:-}
    volumes:
      # Scratch space for OSM downloads / generated PDFs; survives rebuilds.
      - hindata:/srv/data/raw
    expose:
      - "8000"

  caddy:
    # Deliberately no depends_on: Caddy comes up first so /_boot/ can serve the
    # first-boot build log while the backend image is still building.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/log/nj-hin:/srv/logs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  hindata:
  caddy_data:
  caddy_config:
