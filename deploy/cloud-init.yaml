#cloud-config
# Bootstraps an Oracle Cloud (Ubuntu 24.04, aarch64) VM into the NJ HIN API host.
# Paste this into "Advanced options > Management > Cloud-init script" when
# creating the instance. Everything it needs is in the public repo; the only
# secret (the Postgres password) is generated on the machine at first boot.

package_update: true
package_upgrade: false

packages:
  - git
  - docker.io
  - docker-compose-v2
  - netfilter-persistent
  - iptables-persistent

write_files:
  - path: /usr/local/bin/hin
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Operator helper: hin <up|update|logs|ps|shell|psql|ingest ...>
      set -euo pipefail
      cd /opt/nj-hin
      COMPOSE="docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env"
      case "${1:-}" in
        up)      $COMPOSE up -d --build ;;
        update)  git pull --ff-only && $COMPOSE up -d --build && $COMPOSE image prune -f ;;
        logs)    shift; $COMPOSE logs -f --tail=200 "$@" ;;
        ps)      $COMPOSE ps ;;
        shell)   $COMPOSE exec api bash ;;
        psql)    $COMPOSE exec db psql -U "$(grep ^POSTGRES_USER deploy/.env | cut -d= -f2)" "$(grep ^POSTGRES_DB deploy/.env | cut -d= -f2)" ;;
        ingest)  shift; $COMPOSE exec -T api python scripts/ingest_all_real_data.py --cache-dir /srv/data/raw --report /srv/data/processed/real-data-manifest.json "$@" ;;
        run)     shift; $COMPOSE exec api "$@" ;;
        sync)    bash deploy/autoupdate.sh ;;
        *) echo "usage: hin {up|update|sync|logs [svc]|ps|shell|psql|ingest|run <cmd>}"; exit 1 ;;
      esac

  - path: /etc/systemd/system/hin-autoupdate.service
    content: |
      [Unit]
      Description=nj-hin: pull main, rebuild if changed, run one-shot jobs
      After=docker.service
      [Service]
      Type=oneshot
      ExecStart=/bin/bash /opt/nj-hin/deploy/autoupdate.sh
  - path: /etc/systemd/system/hin-autoupdate.timer
    content: |
      [Unit]
      Description=nj-hin auto-update every 3 minutes
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=3min
      [Install]
      WantedBy=timers.target

runcmd:
  # Oracle's Ubuntu image ships an iptables INPUT chain that rejects everything
  # but SSH. Open 80/443 and persist it (the VCN security list must also allow them).
  - iptables -I INPUT 1 -p tcp --dport 80  -m conntrack --ctstate NEW -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 443 -m conntrack --ctstate NEW -j ACCEPT
  - netfilter-persistent save

  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  - git clone https://github.com/parthm667/nj-hin-generator.git /opt/nj-hin
  - chown -R ubuntu:ubuntu /opt/nj-hin

  # Generate deploy/.env once; never overwritten on later boots.
  - |
    if [ ! -f /opt/nj-hin/deploy/.env ]; then
      PW=$(openssl rand -hex 24)
      RL=$(openssl rand -hex 32)
      cat > /opt/nj-hin/deploy/.env <<ENV
    POSTGRES_DB=nj_hin
    POSTGRES_USER=hin
    POSTGRES_PASSWORD=${PW}
    API_DOMAIN=hin-api.mhaske.com
    CORS_ORIGINS=https://mhaske.com,https://www.mhaske.com
    ANONYMOUS_RATE_LIMIT_SECRET=${RL}
    ENV
      chmod 600 /opt/nj-hin/deploy/.env
      chown ubuntu:ubuntu /opt/nj-hin/deploy/.env
    fi

  # Bring Caddy up first so the build log is readable at https://API_DOMAIN/_boot/
  # while the backend image builds; then build + start everything.
  - mkdir -p /var/log/nj-hin
  - cd /opt/nj-hin && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d caddy 2>&1 | tee /var/log/nj-hin/caddy.log
  - cd /opt/nj-hin && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build 2>&1 | tee /var/log/nj-hin/build.log
  - docker ps -a > /var/log/nj-hin/ps.txt 2>&1
  # From here on, a push to main redeploys within ~3 minutes (deploy/autoupdate.sh).
  - systemctl daemon-reload
  - systemctl enable --now hin-autoupdate.timer
  - cp /var/log/cloud-init-output.log /var/log/nj-hin/cloud-init-output.log
  - echo "nj-hin bootstrap finished $(date -Is)" | tee -a /var/log/nj-hin/build.log

final_message: "nj-hin VM ready after $UPTIME seconds. See /var/log/nj-hin/build.log"
