name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: nj_hin_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d nj_hin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended lmodern
        cd backend
        python -m pip install -r requirements-dev.txt

    - name: Initialize PostGIS schema
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nj_hin_test
      run: |
        cd backend
        python scripts/init_schema.py

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nj_hin_test
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nj_hin_test
        DATA_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nj_hin_test
      run: |
        cd backend
        python -m pytest tests/ -q

    - name: Build API container
      run: docker build -t nj-hin-api:ci backend/

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      REACT_APP_API_URL: https://api.example.org/api

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: frontend/.nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run tests
      run: |
        cd frontend
        npm test -- --watchAll=false --runInBand

    - name: Build
      run: |
        cd frontend
        npm run build
